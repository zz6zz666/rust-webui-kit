[workspace]
members = [
    "crates/winkit",
    "crates/traykit",
    "crates/browserhost",
    "crates/webmsg",
    "crates/websurface",
    "crates/winres-embed",
    "demo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zz6zz666/rust-webui-kit"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.61"
